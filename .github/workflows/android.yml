name: Build Rakan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تجهيز جافا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز أدوات أندرويد
        uses: android-actions/setup-android@v3

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: بناء التطبيق
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: تسمية الملف
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/rakan.apk

      - name: رفع الملف كمرفق
        uses: actions/upload-artifact@v4
        with:
          name: rakan-apk
          path: out/rakan.apk

      - name: نشر نسخة للتحميل من الموبايل
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: راكان - نسخة ${{ github.run_number }}
          body: |
            حمّل ملف **rakan.apk** من تحت وثبّته على الموبايل.
            أول مرة الموبايل هيسألك تسمح بالتثبيت من مصدر غير معروف — وافق.
          files: out/rakan.apk
          draft: false
          prerelease: false
